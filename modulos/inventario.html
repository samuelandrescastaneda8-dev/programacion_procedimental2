<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/inventario.css">

    <title>Formulario Inventario</title>
</head>
<body>
    <div class="logo">
        <a href="../index.html">

            <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Casita" width="80">
        </a>
    </div>

    <h1 class="title has-text-centered">Formulario Inventario</h1>

    <div class="container">
        <div class="box">

            <div>

               
                <div class="field">
                    <label class="label">Código Producto</label>
                    <div class="control">
                        <input id="codigo_producto" class="input" type="text" placeholder="Ingrese el código">
                    </div>
                </div>

           
                <div class="field">
                    <label class="label">Nombre Producto</label>
                    <div class="control">
                        <input id="nombre_producto" class="input" type="text" placeholder="Ingrese el nombre">
                    </div>
                </div>

                <!-- Precio -->
                <div class="field">
                    <label class="label">Precio Producto</label>
                    <div class="control">
                        <input id="precio_producto" class="input" type="number" placeholder="Ingrese el precio">
                    </div>
                </div>

              
                <div class="field">
                    <label class="label">Cantidad Producto</label>
                    <div class="control">
                        <input id="cantidad_producto" class="input" type="number" placeholder="Ingrese la cantidad">
                    </div>
                </div>

                
                <div class="field">
                    <label class="label">Marca Producto</label>
                    <div class="control">
                        <input id="marca_producto" class="input" type="text" placeholder="Ingrese la marca">
                    </div>
                </div>

               
                <div class="field">
                    <label class="label">Categoría Producto</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select id="categoria_producto">
                                <option value="">Seleccione una categoría</option>
                                <option>Comida</option>
                                <option>Bebida</option>
                                <option>Adición</option>
                            </select>
                        </div>
                    </div>
                </div>

                
                <div class="field">
                    <label class="label">Unidad de Medida</label>
                    <div class="control">
                        <input id="unidad_medida" class="input" type="text" placeholder="Ej: gramos, ml, kg">
                    </div>
                </div>

                
                <div class="field">
                    <div class="control">
                        <button type="button" onclick="ValidarDatos()" class="button is-primary is-fullwidth" id="boton-guardar">
                            Guardar Producto
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="../js/inventario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
