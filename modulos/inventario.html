<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/inventario.css">

    <title>Formulario Inventario</title>
</head>

<body>

    <h1 class="title has-text-centered">Formulario Inventario</h1>

    <div class="logo">
        <a href="../index.html">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" 
            alt="Casita" width="80">
        </a>
    </div>

    <hr>

    <div class="container">
        <div class="box">

            <form>

                <!-- Codigo -->
                <div class="field">
                    <label class="label">Codigo_producto</label>
                    <div class="control">
                        <input class="input" type="text" placeholder="Ingrese el código">
                    </div>
                </div>

                <!-- Nombre -->
                <div class="field">
                    <label class="label">Nombre_producto</label>
                    <div class="control">
                        <input class="input" type="text" placeholder="Ingrese el nombre">
                    </div>
                </div>

                <!-- Precio -->
                <div class="field">
                    <label class="label">Precio_producto</label>
                    <div class="control">
                        <input class="input" type="number" placeholder="Ingrese el precio">
                    </div>
                </div>

                <!-- Cantidad -->
                <div class="field">
                    <label class="label">Cantidad_producto</label>
                    <div class="control">
                        <input class="input" type="number" placeholder="Ingrese la cantidad">
                    </div>
                </div>

                <!-- Marca -->
                <div class="field">
                    <label class="label">Marca_producto</label>
                    <div class="control">
                        <input class="input" type="text" placeholder="Ingrese la marca">
                    </div>
                </div>

                <!-- Categoria -->
                <div class="field">
                    <label class="label">Categoria_producto</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select>
                                <option>Comida</option>
                                <option>Bebida</option>
                                <option>Adicion</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Unidad -->
                <div class="field">
                    <label class="label">Unidad_medida</label>
                    <div class="control">
                        <input class="input" type="text" placeholder="Ej: gramos, ml, kg">
                    </div>
                </div>

                <!-- Boton -->
                <div class="field">
                    <div class="control">
                        <button class="button is-primary is-fullwidth">
                            Guardar Producto
                        </button>
                    </div>
                </div>

            </form>

        </div>
    </div>

</body>
</html>
