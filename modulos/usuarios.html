<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a001f);
            color: white;
        }

        .formulario {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: #121212;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(128, 0, 255, 0.5);
        }

        .formulario h2 {
            text-align: center;
            color: #bb86fc;
        }

        .formulario label {
            display: block;
            margin-top: 12px;
            color: #d0b3ff;
        }

        .formulario input,
        .formulario select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: white;
            box-sizing: border-box; /* 🔥 solución */
        }

        .formulario input:focus,
        .formulario select:focus {
            outline: none;
            border: 1px solid #bb86fc;
            box-shadow: 0 0 8px #bb86fc;
        }

        .formulario button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #6a00ff, #bb86fc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .formulario button:hover {
            background: linear-gradient(90deg, #bb86fc, #6a00ff);
            box-shadow: 0 0 15px #bb86fc;
        }
    </style>
</head>
<body>

<div class="formulario">
    <h2>Registro</h2>
    <form>
        <label for="nombre_completo">Nombre Completo</label>
        <input type="text" id="nombre_completo" name="nombre_completo" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="numero_celular">Número de Celular</label>
        <input type="tel" id="numero_celular" name="numero_celular" required>

        <label for="genero">Género</label>
        <select id="genero" name="genero" required>
            <option value="">Seleccione</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
        </select>

        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Registrarse</button>
    </form>
</div>

</body>
</html>
